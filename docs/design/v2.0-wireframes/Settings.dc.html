<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account and settings wireframe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;color:#1f1f1f}
.scr{width:390px;height:844px;box-sizing:border-box;background:#fff;display:flex;flex-direction:column;overflow:hidden;border:1px solid #cfcfcf}
.nav{display:flex;align-items:center;gap:8px;padding:12px 8px;border-bottom:1px solid #e4e4e4;flex:none}
.back{min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;font-size:14px;font-weight:600;color:#1d4ed8;font-family:inherit}
.title{font-size:18px;font-weight:700}
.body{flex:1;overflow:hidden;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.avatar{width:56px;height:56px;border-radius:50%;background:#e4e4e4;border:1px solid #6b6b6b;display:flex;align-items:center;justify-content:center;font-size:11px;color:#333;flex:none}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #1f1f1f;background:#1f1f1f;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;font-family:inherit}
.sec{font-size:14px;font-weight:700;color:#595959;margin-top:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;border-bottom:1px solid #e4e4e4;font-size:15px;background:none;border-left:0;border-right:0;border-top:0;font-family:inherit;color:#1f1f1f;text-align:left;width:100%}
.val{font-size:13px;color:#595959}
.row{display:flex;align-items:center;gap:12px}
.muted{color:#595959;font-size:13px}
</style>
</helmet>
<div class="scr">
  <div class="nav">
    <button type="button" class="back">Back</button>
    <div class="title">Account and settings</div>
  </div>
  <div class="body">
    <div class="row" style="padding:6px 0">
      <div class="avatar">Guest</div>
      <div style="flex:1"><b>Guest</b><div class="muted">Saved on this device</div></div>
      <button type="button" class="btn">Sign in</button>
    </div>
    <div class="sec">Shopping</div>
    <button type="button" class="item"><span>Location</span><span class="val">Mead, CO 80542</span></button>
    <button type="button" class="item"><span>My stores</span><span class="val">6 selected</span></button>
    <div class="sec">Meal Prep</div>
    <button type="button" class="item"><span>Dietary, macros, cookware</span><span class="val">Any</span></button>
    <button type="button" class="item"><span>Default servings</span><span class="val">6</span></button>
    <div class="sec">Account</div>
    <button type="button" class="item"><span>Sync status</span><span class="val">Device only</span></button>
    <button type="button" class="item"><span>AI features</span><span class="val">Sign in to access</span></button>
    <button type="button" class="item"><span>Weekly digest</span><span class="val">Preview</span></button>
    <div class="sec">About</div>
    <button type="button" class="item"><span>Data Explorer</span><span class="val">Open</span></button>
    <button type="button" class="item"><span>API docs</span><span class="val">Open</span></button>
    <button type="button" class="item"><span>Privacy and terms</span><span class="val">Open</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
