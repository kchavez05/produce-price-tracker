<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan wireframe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;color:#1f1f1f}
.scr{width:390px;height:844px;box-sizing:border-box;background:#fff;display:flex;flex-direction:column;overflow:hidden;border:1px solid #cfcfcf}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:12px}
.logo{font-weight:700;font-size:18px}
.avatar{width:44px;height:44px;border-radius:50%;background:#e4e4e4;border:1px solid #6b6b6b;display:flex;align-items:center;justify-content:center;font-size:11px;color:#333}
.body{flex:1;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.tabbar{height:84px;border-top:1px solid #cfcfcf;display:flex;background:#f7f7f7;flex:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:#595959}
.tab.on{color:#111;font-weight:700}
.ico{width:24px;height:24px;border:2px solid currentColor;border-radius:6px;box-sizing:border-box}
.card{border:1px solid #cfcfcf;border-radius:12px;padding:12px;background:#fafafa;display:flex;flex-direction:column;gap:8px;flex:none}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #6b6b6b;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#1f1f1f;font-family:inherit}
.btn.pri{background:#1f1f1f;color:#fff;border-color:#1f1f1f}
.btn.quiet{border-color:#cfcfcf;color:#595959;font-weight:500}
.row{display:flex;align-items:center;gap:8px}
.muted{color:#595959;font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid #6b6b6b;display:flex;align-items:center;font-size:14px;color:#333;white-space:nowrap;background:#fff;font-family:inherit}
.step{display:flex;border:1px solid #6b6b6b;border-radius:10px;overflow:hidden;flex:none}
.step span{width:48px;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#333}
.step span.on{background:#1f1f1f;color:#fff}
.tag{font-size:12px;font-weight:700;border:1px solid #6b6b6b;border-radius:6px;padding:2px 8px;color:#333}
.ph{background:#e4e4e4;border-radius:6px}
.hint{border:1px dashed #6b6b6b;border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;font-size:13px;color:#333}
</style>
</helmet>
<div class="scr">
  <div class="top">
    <div class="logo">PantryBot</div>
    <button type="button" class="avatar" aria-label="Account and settings">Acct</button>
  </div>
  <div class="body">
    <h1 class="sr">Plan</h1>
    <div class="row" style="justify-content:space-between">
      <span class="muted">Servings</span>
      <div class="step"><span>4</span><span class="on">6</span><span>8</span></div>
    </div>
    <button type="button" class="chip" style="justify-content:space-between">Any macros &middot; No restrictions &middot; Edit preferences</button>
    <div class="hint">
      <span>Mark what you have in Pantry to lower the cost.</span>
      <button type="button" class="btn quiet" aria-label="Dismiss hint">Hide</button>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between"><b style="font-size:16px">Chicken and White Bean Stew</b><span class="tag">$1.40/srv</span></div>
      <div class="muted">32g protein &middot; uses 3 items from King Soopers</div>
      <div class="row">
        <button type="button" class="btn pri" style="flex:1">View dish</button>
        <button type="button" class="btn">Save</button>
      </div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between"><b style="font-size:16px">Pork and Poblano Casserole</b><span class="tag">$1.62/srv</span></div>
      <div class="muted">28g protein &middot; uses 4 items, 1 already at home</div>
      <div class="row">
        <button type="button" class="btn pri" style="flex:1">View dish</button>
        <button type="button" class="btn">Save</button>
      </div>
    </div>
    <div class="card">
      <b style="font-size:16px">Squash and Lentil Braise</b>
      <div class="ph" style="height:20px" role="img" aria-label="cost and macro summary placeholder"></div>
    </div>
    <div class="row" style="justify-content:space-between;border:1px solid #cfcfcf;border-radius:12px;padding:8px 12px;flex:none">
      <span style="font-size:14px">Ask AI Chef</span>
      <button type="button" class="btn quiet">Sign in to use</button>
    </div>
  </div>
  <div class="tabbar">
    <div class="tab"><div class="ico"></div>Shop</div>
    <div class="tab"><div class="ico"></div>Pantry</div>
    <div class="tab on"><div class="ico"></div>Plan</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
