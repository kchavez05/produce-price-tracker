<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pantry first visit wireframe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;color:#1f1f1f}
.scr{width:390px;height:844px;box-sizing:border-box;background:#fff;display:flex;flex-direction:column;overflow:hidden;border:1px solid #cfcfcf}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:12px}
.logo{font-weight:700;font-size:18px}
.avatar{width:44px;height:44px;border-radius:50%;background:#e4e4e4;border:1px solid #6b6b6b;display:flex;align-items:center;justify-content:center;font-size:11px;color:#333}
.body{flex:1;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.tabbar{height:84px;border-top:1px solid #cfcfcf;display:flex;background:#f7f7f7;flex:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:#595959}
.tab.on{color:#111;font-weight:700}
.ico{width:24px;height:24px;border:2px solid currentColor;border-radius:6px;box-sizing:border-box}
.row{display:flex;align-items:center;gap:8px}
.search{min-height:44px;border:1px solid #6b6b6b;border-radius:10px;padding:0 12px;display:flex;align-items:center;font-size:14px;color:#595959;flex:1;background:#fff;font-family:inherit;text-align:left}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #6b6b6b;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#1f1f1f;font-family:inherit}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:0 16px}
.mark{width:72px;height:72px;border:2px dashed #6b6b6b;border-radius:16px}
.muted{color:#595959;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid #6b6b6b;display:flex;align-items:center;font-size:14px;color:#333;background:#fff;font-family:inherit}
.sec{font-size:14px;font-weight:700;color:#595959}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div class="scr">
  <div class="top">
    <div class="logo">PantryBot</div>
    <button type="button" class="avatar" aria-label="Account and settings">Acct</button>
  </div>
  <div class="body">
    <h1 class="sr">Pantry</h1>
    <div class="row">
      <button type="button" class="search">Search or add an ingredient</button>
      <button type="button" class="btn" aria-label="Add by scanning a barcode">Scan</button>
      <button type="button" class="btn" aria-label="Add by voice">Voice</button>
    </div>
    <div class="empty">
      <div class="mark" role="img" aria-label="Empty pantry illustration placeholder"></div>
      <h2 style="margin:0;font-size:20px">Your Pantry Is Empty</h2>
      <div class="muted">That's fine. Pantry is optional. Add what you have and Shop and Plan will skip it.</div>
      <div class="sec" style="margin-top:8px">Common Staples</div>
      <div class="chips">
        <button type="button" class="chip">Add Olive oil</button>
        <button type="button" class="chip">Add Salt</button>
        <button type="button" class="chip">Add Canned black beans</button>
        <button type="button" class="chip">Add Dry basmati rice</button>
      </div>
      <div class="muted" style="font-size:13px">These are shortcuts. Nothing is preselected or required.</div>
    </div>
  </div>
  <div class="tabbar">
    <div class="tab"><div class="ico"></div>Shop</div>
    <div class="tab on"><div class="ico"></div>Pantry</div>
    <div class="tab"><div class="ico"></div>Plan</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
