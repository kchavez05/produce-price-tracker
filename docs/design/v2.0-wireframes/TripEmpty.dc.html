<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop empty trip wireframe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;color:#1f1f1f}
.scr{width:390px;height:844px;box-sizing:border-box;background:#fff;display:flex;flex-direction:column;overflow:hidden;border:1px solid #cfcfcf}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:12px}
.logo{font-weight:700;font-size:18px}
.avatar{width:44px;height:44px;border-radius:50%;background:#e4e4e4;border:1px solid #6b6b6b;display:flex;align-items:center;justify-content:center;font-size:11px;color:#333}
.body{flex:1;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:12px}
.tabbar{height:84px;border-top:1px solid #cfcfcf;display:flex;background:#f7f7f7;flex:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:#595959}
.tab.on{color:#111;font-weight:700}
.ico{width:24px;height:24px;border:2px solid currentColor;border-radius:6px;box-sizing:border-box}
.seg{display:flex;border:1px solid #6b6b6b;border-radius:10px;overflow:hidden;flex:none}
.seg>span{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#333}
.seg>span.on{background:#1f1f1f;color:#fff}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:0 24px}
.mark{width:72px;height:72px;border:2px dashed #6b6b6b;border-radius:16px}
.btn{min-height:48px;padding:0 20px;border-radius:10px;border:1px solid #6b6b6b;background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#1f1f1f;font-family:inherit;width:100%}
.btn.pri{background:#1f1f1f;color:#fff;border-color:#1f1f1f}
.muted{color:#595959;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div class="scr">
  <div class="top">
    <div class="logo">PantryBot</div>
    <button type="button" class="avatar" aria-label="Account and settings">Acct</button>
  </div>
  <div class="body">
    <h1 class="sr">Shop</h1>
    <div class="seg"><span>Deals</span><span class="on">Trip</span><span>Radar</span></div>
    <div class="empty">
      <div class="mark" role="img" aria-label="Empty list illustration placeholder"></div>
      <h2 style="margin:0;font-size:20px">Your Trip Is Empty</h2>
      <div class="muted">Add deals from Deals, or add the missing ingredients from a dish in Plan.</div>
      <button type="button" class="btn pri">Browse Deals</button>
      <button type="button" class="btn">Go to Plan</button>
    </div>
  </div>
  <div class="tabbar">
    <div class="tab on"><div class="ico"></div>Shop</div>
    <div class="tab"><div class="ico"></div>Pantry</div>
    <div class="tab"><div class="ico"></div>Plan</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
