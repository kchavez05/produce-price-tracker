# Dependabot configuration for PantryBot (produce-price-tracker)
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      routine-npm-updates:
        # Keep related framework/tooling packages together in the weekly update.
        # Unmatched major upgrades remain individual PRs; security updates are separate.
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Major TypeScript upgrades need coordinated Next.js and ESLint compatibility review.
      # Keep receiving patch and minor updates within the supported compiler major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
