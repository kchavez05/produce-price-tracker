name: Visual Baselines

# Generates visual snapshot baselines in the Playwright image (the same one the visual job compares in), the only
# place they may come from (rendering differs by OS). The server renders the curated weekly baseline only, with no live
# circular fetch, so a market refresh never changes them (#796). It never commits: it uploads the images as an artifact,
# and a person downloads them, reviews the diff and commits them. Run it from the Actions tab, or add the
# "update-visual-baselines" label to a pull request.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate baselines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The tag must equal the pinned @playwright/test version; tests/unit/ci/playwright-image.test.ts enforces that.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-visual-baselines'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # faketime (one small package) is the only apt install left; the image has no sudo, so the retry cleanup runs as root.
      - name: Install faketime (pins the server clock for visual runs)
        run: .github/scripts/retry-with-timeout.sh 120 3 sh -c 'apt-get update -qq && apt-get install -y --no-install-recommends faketime'
        env:
          RETRY_CLEANUP: "pkill -KILL -x 'apt-get|apt|dpkg' || true; sleep 2; dpkg --configure -a"

      - name: Build production app
        run: npm run build -- --no-lint
        env:
          # Serves the dev-only /design style guide in this e2e build. Never set on Vercel.
          E2E_DESIGN_GUIDE: '1'

      - name: Generate baselines
        run: npm run test:e2e:update
        env:
          E2E_SKIP_BUILD: '1'

      - name: Upload baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/e2e/__screenshots__/
          if-no-files-found: error
          retention-days: 14

      - name: Explain next steps
        run: |
          {
            echo "### Visual baselines generated"
            echo
            echo "Download the \`visual-baselines\` artifact, extract it into \`tests/e2e/__screenshots__/\`,"
            echo "review the image diff and commit it in a pull request. This workflow never commits."
          } >> "$GITHUB_STEP_SUMMARY"
