name: Weekly Market Ingestion Health
on:
  schedule:
    - cron: '0 16 * * 3'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify Wednesday ingestion completed
        # Failure uses normal GitHub Actions workflow notifications; no USDA key in CI.
        run: curl --fail --silent --show-error --max-time 30 https://www.pantrybot.dev/api/health/market
