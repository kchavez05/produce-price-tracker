name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
      - release
      - develop
  push:
    branches:
      - main
      - release
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify approved cooking catalog projection
        run: npm run catalog:build -- --check

      - name: Verify generated design tokens
        run: npm run design:tokens -- --check

      - name: Guard against new raw palette classes
        run: npm run design:palette

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Tier 1 Unit Testing Policy (All Branches & PRs)
        run: npm run test:unit

      - name: Tier 2 Smoke Testing Suite (develop/main PRs and pushes)
        if: github.event_name == 'push' || github.base_ref == 'develop' || github.base_ref == 'main' || github.base_ref == 'release'
        run: npm run test:smoke

      - name: Tier 3 Regression Testing Suite (main/release PRs and pushes)
        if: (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'release')) || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'release'))
        run: npm run test:regression

      - name: Verify production Next.js build
        run: npm run build

      - name: Dependency security audit (critical)
        run: npm audit --omit=dev --audit-level=critical

  # Decides whether the Browser Tests job is needed. For a PR into develop whose changed files all
  # match the skip list (docs, repo metadata, workflows that do not build or test the app) the
  # browser job is skipped. It fails safe: any other path, a PR to main or release, a push, an
  # empty file list or an API error means product=true. A job skipped by its `if` reports as
  # successful, so this stays compatible with making Browser Tests a required check.
  changes:
    name: Detect product changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      product: ${{ steps.detect.outputs.product }}
    steps:
      - name: Classify changed files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -u
          echo "product=true" >> "$GITHUB_OUTPUT"   # fail-safe default
          if [ "$EVENT" != "pull_request" ] || [ "$BASE" != "develop" ]; then
            echo "Not a PR into develop; running browser tests."; exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)') || { echo "file list failed; running browser tests"; exit 0; }
          [ -n "$files" ] || { echo "empty file list; running browser tests"; exit 0; }
          # Paths that cannot change the built app or the browser tests. Anything else counts as product.
          skip='^(docs/|\.claude/|\.github/(ISSUE_TEMPLATE/|scripts/|pull_request_template\.md$|copilot-instructions\.md$|dependabot\.yml$|workflows/(project-status|claude|claude-code-review|market-health)\.yml$)|[^/]+\.md$|LICENSE$)'
          product=$(printf '%s\n' "$files" | grep -Ev "$skip" || true)
          if [ -z "$product" ]; then
            echo "Only non-product files changed; skipping browser tests."
            echo "product=false" >> "$GITHUB_OUTPUT"
          else
            echo "Product files changed:"; printf '%s\n' "$product" | head -20
          fi

  # v2.0 M2 browser tests (Playwright, WebKit). A separate job so the required
  # "Typecheck, Lint & Build" check keeps its name and timing. Not a required check yet;
  # it becomes required for develop after about two stable weeks (branch protection is
  # the repository owner's change). Keyless: no secrets, no network beyond the local server.
  # Runs for PRs (not for the matching branch push, which would duplicate the PR run), for pushes
  # to develop, main and release, and is skipped for PRs into develop that only touch non-product files.
  browser-tests:
    name: Browser Tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # !cancelled() plus the result check keep this fail-safe: if the `changes` job fails or times
    # out, its dependents would otherwise be skipped (which reports as success) without running.
    if: >-
      ${{ !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.product == 'true') &&
      ((github.event_name == 'push' && contains(fromJSON('["develop","main","release"]'), github.ref_name)) ||
       github.base_ref == 'develop' || github.base_ref == 'main' || github.base_ref == 'release') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install WebKit and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: .github/scripts/retry-with-timeout.sh 180 2 npx playwright install --with-deps webkit

      - name: Install WebKit system dependencies (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: .github/scripts/retry-with-timeout.sh 120 3 npx playwright install-deps webkit

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Type errors still fail the build; lint already runs in Typecheck, Lint & Build.
      - name: Build production app
        run: npm run build -- --no-lint
        env:
          # Serves the dev-only /design style guide in this e2e build. Never set on Vercel.
          E2E_DESIGN_GUIDE: '1'

      - name: Tier 2 browser smoke (WebKit, iPhone and iPad portrait)
        run: npm run test:e2e:smoke
        env:
          E2E_SKIP_BUILD: '1'

      - name: Upload Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # v2.0 M2 browser Tier 3 (Playwright): the full viewport matrix (six WebKit sizes) and a Chromium
  # cross-check at 390 and 820 px, running the same journeys as Tier 2 (the Vitest Tier 3 step in the
  # job above is separate). Runs on PRs to main or release, pushes to main or release, and develop PRs
  # carrying the run-tier3 label (apply the label before pushing, or re-run the workflow, because
  # labeling alone does not re-trigger this workflow). Budget: at most 10 minutes (plan section 7).
  # Not a required check; the visual snapshots have their own advisory job below.
  #
  # Sharded three ways (decided 2026-11-17). The first run on one runner hit the 10 minute limit with
  # 76 of 176 tests done (about 9.5 tests a minute on a two-vCPU runner, so roughly 18 minutes in
  # total). The six extra projects also skip the helper self-tests (146 tests), and each shard gets
  # about a third of them with the 10 minute budget per job. Each shard builds the app itself.
  browser-tests-tier3:
    name: Browser Tests (Tier 3, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    if: >-
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'release' || contains(github.event.pull_request.labels.*.name, 'run-tier3')))
      || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'release'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Its own cache key: this job needs Chromium as well as WebKit, so it must not share the
      # WebKit-only cache of the Tier 2 job.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install WebKit, Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: .github/scripts/retry-with-timeout.sh 180 2 npx playwright install --with-deps webkit chromium

      - name: Install WebKit and Chromium system dependencies (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: .github/scripts/retry-with-timeout.sh 120 3 npx playwright install-deps webkit chromium

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Type errors still fail the build; lint already runs in Typecheck, Lint & Build.
      - name: Build production app
        run: npm run build -- --no-lint
        env:
          # Serves the dev-only /design style guide in this e2e build. Never set on Vercel.
          E2E_DESIGN_GUIDE: '1'

      - name: Tier 3 browser regression (six WebKit sizes, Chromium cross-check), shard ${{ matrix.shard }}/3
        run: npm run test:e2e:regression -- --shard=${{ matrix.shard }}/3
        env:
          E2E_SKIP_BUILD: '1'

      # Also on cancel (for example a timeout), so traces of tests that were retried are kept.
      - name: Upload Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-tier3-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # v2.0 M2 visual snapshots (Tier 3). Advisory for the first two weeks of green runs
  # (continue-on-error), then made blocking by removing that line. Runs on PRs to main or
  # release, pushes to main or release, and develop PRs carrying the run-tier3 label (apply the
  # label before pushing, or re-run the workflow). Baselines are committed PNGs generated only by
  # the Visual Baselines workflow on ubuntu-latest; until they exist this job reports that and passes.
  visual-snapshots:
    name: Visual Snapshots (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    if: >-
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'release' || contains(github.event.pull_request.labels.*.name, 'run-tier3')))
      || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'release'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Report missing baselines
        if: hashFiles('tests/e2e/__screenshots__/**/*.png') == ''
        run: echo "No visual baselines are committed yet. Run the Visual Baselines workflow and commit its artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Read Playwright version
        if: hashFiles('tests/e2e/__screenshots__/**/*.png') != ''
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: hashFiles('tests/e2e/__screenshots__/**/*.png') != ''
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install WebKit and system dependencies
        if: hashFiles('tests/e2e/__screenshots__/**/*.png') != '' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: .github/scripts/retry-with-timeout.sh 180 2 npx playwright install --with-deps webkit

      - name: Install WebKit system dependencies (cached browsers)
        if: hashFiles('tests/e2e/__screenshots__/**/*.png') != '' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: .github/scripts/retry-with-timeout.sh 120 3 npx playwright install-deps webkit

      - name: Install faketime (pins the server clock for visual runs)
        if: hashFiles('tests/e2e/__screenshots__/**/*.png') != ''
        run: sudo apt-get install -y --no-install-recommends faketime

      - name: Cache Next.js build cache
        if: hashFiles('tests/e2e/__screenshots__/**/*.png') != ''
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build production app
        if: hashFiles('tests/e2e/__screenshots__/**/*.png') != ''
        run: npm run build -- --no-lint
        env:
          # Serves the dev-only /design style guide in this e2e build. Never set on Vercel.
          E2E_DESIGN_GUIDE: '1'

      - name: Visual snapshots (WebKit, iPhone and iPad portrait)
        if: hashFiles('tests/e2e/__screenshots__/**/*.png') != ''
        run: npm run test:e2e:visual
        env:
          E2E_SKIP_BUILD: '1'

      - name: Upload visual diff report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
