name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
      - release
      - develop
  push:
    branches:
      - main
      - release
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify approved cooking catalog projection
        run: npm run catalog:build -- --check

      - name: Verify generated design tokens
        run: npm run design:tokens -- --check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Tier 1 Unit Testing Policy (All Branches & PRs)
        run: npm run test:unit

      - name: Tier 2 Smoke Testing Suite (develop/main PRs and pushes)
        if: github.event_name == 'push' || github.base_ref == 'develop' || github.base_ref == 'main' || github.base_ref == 'release'
        run: npm run test:smoke

      - name: Tier 3 Regression Testing Suite (main/release PRs and pushes)
        if: (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'release')) || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'release'))
        run: npm run test:regression

      - name: Verify production Next.js build
        run: npm run build

      - name: Dependency security audit (critical)
        run: npm audit --omit=dev --audit-level=critical
