name: Claude Code Review

on:
  pull_request:
    # One round only: review when a PR is opened or marked ready, not on every push.
    types: [opened, ready_for_review]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip draft PRs; they are reviewed when marked ready for review.
    if: github.event.pull_request.draft == false
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Write access is only for the fallback comment step below.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record review start time
        id: review-start
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The review plugin can exit early (or fail) and leave no trace on the PR, which
      # looks the same as a review that never ran. If claude[bot] posted nothing since
      # this job started, say so, so the absence of a comment is never ambiguous. This
      # does NOT claim the code is clean and does not count as a completed review.
      - name: Leave a comment if no review was posted
        if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.review-start.outputs.started }}
          OUTCOME: ${{ steps.claude-review.outcome }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_PATH: .github/workflows/claude-code-review.yml
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          since="${STARTED:-1970-01-01T00:00:00Z}"
          bot='claude[bot]'
          issue_comments=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login==\"$bot\" and .created_at >= \"$since\")] | length" | awk '{s+=$1} END{print s+0}')
          reviews=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq "[.[] | select(.user.login==\"$bot\" and .submitted_at >= \"$since\")] | length" | awk '{s+=$1} END{print s+0}')
          inline=$(gh api "repos/$REPO/pulls/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login==\"$bot\" and .created_at >= \"$since\")] | length" | awk '{s+=$1} END{print s+0}')
          total=$(( ${issue_comments:-0} + ${reviews:-0} + ${inline:-0} ))
          if [ "$total" -gt 0 ]; then
            echo "claude[bot] posted $total item(s) on this PR; no fallback needed."
            exit 0
          fi
          # claude-code-action silently skips (and the job stays green) when this workflow
          # file differs from the default branch, and the step outcome cannot tell a skip
          # from other failures. So report the likely cause, never assert it.
          cause=""
          default_sha=$(gh api "repos/$REPO/contents/$WORKFLOW_PATH?ref=$DEFAULT_BRANCH" --jq .sha 2>/dev/null || true)
          pr_sha=$(gh api "repos/$REPO/contents/$WORKFLOW_PATH?ref=$PR_HEAD_SHA" --jq .sha 2>/dev/null || true)
          if [ -z "$default_sha" ] || [ -z "$pr_sha" ]; then
            cause="Could not compare \`$WORKFLOW_PATH\` with \`$DEFAULT_BRANCH\` (API lookup failed), so the cause is unknown."
          elif [ "$default_sha" != "$pr_sha" ]; then
            cause="Likely cause: this PR head's \`$WORKFLOW_PATH\` differs from \`$DEFAULT_BRANCH\`, and claude-code-action skips itself in that case, so the workflow is not validated until the change reaches \`$DEFAULT_BRANCH\`. Use a local \`/code-review --comment\` run on this head instead of waiting."
          fi
          echo "::warning title=No Claude review recorded::claude[bot] posted nothing for this head (step outcome: $OUTCOME). ${cause}"
          gh pr comment "$PR" --repo "$REPO" --body "## Code review

          The automated Claude review job finished (step outcome: \`${OUTCOME}\`) without posting a review or comment, so **no assessment was recorded** for this head. This is not a clean result. ${cause}

          Request one with \`@claude review the latest head against AGENTS.md and docs/code-review.md\`, or run \`/code-review --comment\` locally. [Job run](${RUN_URL})"
