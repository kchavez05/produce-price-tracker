name: Claude Code Review

on:
  pull_request:
    # One round only: review when a PR is opened or marked ready, not on every push.
    types: [opened, ready_for_review]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip draft PRs; they are reviewed when marked ready for review.
    if: github.event.pull_request.draft == false
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Write access is only for the fallback comment step below.
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record review start time
        id: review-start
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A plain prompt, not the code-review plugin: the plugin starts an async
          # eligibility agent and the action ends the session before it reports, so runs
          # exit green with no comment (anthropics/claude-code-action#1646). Background
          # tasks are disabled for the same reason.
          settings: '{"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }}.

            1. Read AGENTS.md and docs/code-review.md in the checkout (sections 3 and 4 of
               AGENTS.md hold the review rules), then read the diff with `gh pr diff` and
               the description with `gh pr view`. Read changed files for context as needed.
            2. Look for correctness bugs, security and ownership problems, sync data loss,
               and violations of those rules. Report only findings you can point to in the
               diff; label each P0, P1 or P2 and give file and line. Skip style nits.
            3. Do the review yourself in this session; do not delegate to other agents.
            4. Post inline comments for line-specific findings with the inline comment tool,
               then post exactly one top-level comment with
               `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`.
               Start it with `## Code review`. List findings by severity, or state
               "No P0/P1/P2 findings" and what you checked. Always post this comment.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Glob,Grep,Write"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The review can exit early (or fail) and leave no trace on the PR, which
      # looks the same as a review that never ran. If claude[bot] posted nothing since
      # this job started, say so, so the absence of a comment is never ambiguous. This
      # does NOT claim the code is clean and does not count as a completed review.
      - name: Leave a comment if no review was posted
        if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.review-start.outputs.started }}
          OUTCOME: ${{ steps.claude-review.outcome }}
          # Empty when the action exited before running Claude (e.g. a validation skip).
          CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_PATH: .github/workflows/claude-code-review.yml
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          since="${STARTED:-1970-01-01T00:00:00Z}"
          bot='claude[bot]'
          count_bot() { # $1 = REST path, $2 = timestamp field
            gh api "$1" --paginate \
              --jq "[.[] | select(.user.login==\"$bot\" and .$2 >= \"$since\")] | length" \
              | awk '{s+=$1} END{print s+0}'
          }
          issue_comments=$(count_bot "repos/$REPO/issues/$PR/comments" created_at)
          reviews=$(count_bot "repos/$REPO/pulls/$PR/reviews" submitted_at)
          inline=$(count_bot "repos/$REPO/pulls/$PR/comments" created_at)
          total=$(( ${issue_comments:-0} + ${reviews:-0} + ${inline:-0} ))
          if [ "$total" -gt 0 ]; then
            echo "claude[bot] posted $total item(s) on this PR; no fallback needed."
            exit 0
          fi
          # claude-code-action silently skips (and the job stays green) when this workflow
          # file differs from the default branch, and the step outcome cannot tell a skip
          # from other failures. So report the likely cause, never assert it.
          cause=""
          default_sha=$(gh api "repos/$REPO/contents/$WORKFLOW_PATH?ref=$DEFAULT_BRANCH" --jq .sha 2>/dev/null || true)
          pr_sha=$(gh api "repos/$REPO/contents/$WORKFLOW_PATH?ref=$PR_HEAD_SHA" --jq .sha 2>/dev/null || true)
          if [ -z "$default_sha" ] || [ -z "$pr_sha" ]; then
            cause="Could not compare \`$WORKFLOW_PATH\` with \`$DEFAULT_BRANCH\` (API lookup failed), so the cause is unknown."
          elif [ "$default_sha" != "$pr_sha" ]; then
            cause="Likely cause: this PR head's \`$WORKFLOW_PATH\` differs from \`$DEFAULT_BRANCH\`, and claude-code-action skips itself in that case, so the workflow is not validated until the change reaches \`$DEFAULT_BRANCH\`. Use a local \`/code-review --comment\` run on this head instead of waiting."
          elif [ -z "${CONCLUSION:-}" ]; then
            cause="Likely cause: the action exited before running Claude (no \`conclusion\` output) although the workflow file matches \`$DEFAULT_BRANCH\`. Its server-side workflow validation can skip intermittently (seen on #734; a re-run passed), so re-run this job."
          fi
          echo "::warning title=No Claude review recorded::claude[bot] posted nothing for this head (step outcome: $OUTCOME). ${cause}"
          gh pr comment "$PR" --repo "$REPO" --body "## Code review

          The automated Claude review job finished (step outcome: \`${OUTCOME}\`) without posting a review or comment, so **no assessment was recorded** for this head. This is not a clean result. ${cause}

          Request one with \`@claude review the latest head against AGENTS.md and docs/code-review.md\`, or run \`/code-review --comment\` locally. [Job run](${RUN_URL})"
